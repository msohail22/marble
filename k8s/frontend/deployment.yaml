apiVersion: apps/v1
kind: Deployment
metadata:
  name: marble-web
  namespace: marble
  labels:
    app.kubernetes.io/name: marble-web
    app.kubernetes.io/part-of: marble
spec:
  replicas: 2
  selector:
    matchLabels:
      app: marble-web
  template:
    metadata:
      labels:
        app: marble-web
    spec:
      containers:
      - name: web
        image: marble-web:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        livenessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          limits:
            cpu: "300m"
            memory: "256Mi"
          requests:
            cpu: "50m"
            memory: "64Mi"

